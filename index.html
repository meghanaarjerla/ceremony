<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seemantham Ceremony - Prabhasree & Bhanuchandar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <div class="header-section">
            <div class="floral-top"></div>
            <h1 class="main-title">Seemantham<br>Ceremony</h1>
            <h2 class="subtitle">Prabhasree & Bhanuchandar</h2>
        </div>

        <!-- Main Content Section -->
        <div class="content-section">
            <p class="invitation-text">We are becoming 3 now, join us to welcome our<br>little one</p>
            
            <!-- Date and Time Section -->
            <div class="event-details">
                <div class="date-time-wrapper">
                    <span class="day-of-week">SUNDAY</span>
                    <span class="day">05</span>
                    <span class="time">AT 10:00 AM</span>
                </div>
                <div class="date-box">
                    <span class="month">JULY</span>
                    <span class="year">2026</span>
                </div>
            </div>

            <!-- Countdown Timer -->
            <div class="countdown-section">
                <h3>Time Until Event</h3>
                <div class="countdown">
                    <div class="countdown-item">
                        <span id="days" class="countdown-value">0</span>
                        <span class="countdown-label">Days</span>
                    </div>
                    <div class="countdown-item">
                        <span id="hours" class="countdown-value">0</span>
                        <span class="countdown-label">Hours</span>
                    </div>
                    <div class="countdown-item">
                        <span id="minutes" class="countdown-value">0</span>
                        <span class="countdown-label">Minutes</span>
                    </div>
                    <div class="countdown-item">
                        <span id="seconds" class="countdown-value">0</span>
                        <span class="countdown-label">Seconds</span>
                    </div>
                </div>
            </div>

            <!-- Venue Section -->
            <div class="venue-section">
                <p class="venue-label">FOLLOWED BY LUNCH AT THE VENUE</p>
                <p class="venue-name">VENUE: VR FUNCTION HALL</p>
                <p class="venue-address">CHANUKYA NAGAR,<br>CHINNAMUSHIDIWADA, PENDURTHI.</p>
            </div>

            <!-- Buttons Section -->
            <div class="buttons-section">
                <button class="btn btn-venue" onclick="openGoogleMaps()">📍 View Venue on Maps</button>
                <button class="btn btn-save-date" onclick="saveToCalendar()">📅 Save the Date</button>
            </div>
        </div>

        <!-- Floral Decoration Bottom -->
        <div class="floral-bottom"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
